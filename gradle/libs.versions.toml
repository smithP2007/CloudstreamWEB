# NOTE: `kotlin` version MUST be >= the Kotlin version used to build the
# upstream CloudStream :library artifact (see upstream/gradle/libs.versions.toml,
# currently 2.4.0), otherwise Kotlin metadata cannot be read.
[versions]
kotlin = "2.4.0"
kotlinxSerialization = "1.11.0"
coroutines = "1.11.0"
ktor = "3.5.0"
sqlite = "3.49.1.0"
junitJupiter = "5.11.4"
jackson = "2.13.1"   # upstream: do not bump, keeps parity with extension builds
okhttp = "4.12.0"
csLibrary = "4.8.0"  # JitPack-published upstream :library (JitPack build verified "ok")

[libraries]
# The published CloudStream plugin API surface (BasePlugin, CloudstreamPlugin, MainAPI, ...)
cs-library = { module = "com.github.recloudstream.cloudstream:library", version.ref = "csLibrary" }
jackson = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jackson" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junitJupiter" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

# Ktor server (BOM-managed)
ktor-bom = { module = "io.ktor:ktor-bom", version.ref = "ktor" }
ktor-server-core = { module = "io.ktor:ktor-server-core" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
